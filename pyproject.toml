[project]
name = "pdfmasker"
description = "Python library for masking sensitive text in PDFs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dima Anfimov", email = "lovesolaristics@gmail.com" }]
requires-python = ">=3.10,<4"
keywords = ["pdf", "masking", "redaction", "pii"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Text Processing :: Filters",
  "Typing :: Typed"
]
dynamic = ["version"]
dependencies = [
    "pikepdf>=10.11.0",
]

[project.optional-dependencies]
faker = [
    "faker>=25.0.0",
]

[project.urls]
Documentation = "https://github.com/danfimov/pdfmasker"
Repository = "https://github.com/danfimov/pdfmasker"
Changelog = "https://github.com/danfimov/pdfmasker/releases"

[dependency-groups]
dev = [
    {include-group = "pre-commit"},
    {include-group = "build"},
    {include-group = "lint"},
    {include-group = "test"},
]
pre-commit = [
    "prek>=0.4.12",
]
build = [
    "hatchling>=0.0.1",
]

lint = [
    "ruff>=0.16.2",
    "ty>=0.0.72",
    "zizmor>=1.29.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-codspeed>=5.0.3",
    "pytest-memray>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pdfmasker/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfmasker"]

[tool.hatch.build.targets.sdist]
include = [
  "src/pdfmasker",
  "README.md",
  "LICENSE",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "CPY",
    "D203",  # conflicting with D211
    "D213",  # conflicting with D212
    "D413",
    "D100",
    "D104",
    "COM812",
    "A005",  # `abc`/`types` deliberately shadow stdlib module names in this package layout
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",
    "ANN",
    "PLR2004",
    "S101",
    "INP001",  # test directories are not import packages
    "ARG",     # test doubles carry protocol-required but unused arguments
    "EM",      # test doubles raise string literals directly for brevity
]
"examples/**" = [
    "INP001",
    "T201",
]
