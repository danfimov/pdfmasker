[project]
name = "pdfmasker"
description = "Mask sensitive text in PDFs."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["pdf", "masking", "redaction", "pii"]
dynamic = ["version"]
dependencies = []

[dependency-groups]
dev = [
    {include-group = "pre-commit"},
    {include-group = "build"},
    {include-group = "lint"},
    {include-group = "test"},
]
pre-commit = [
    "prek>=0.4.12",
]
build = [
    "hatchling>=0.0.1",
]

lint = [
    "ruff>=0.16.2",
    "zizmor>=1.29.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-codspeed>=5.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pdfmasker/__init__.py"

# --- wheel: ships the Python package plus the compiled Go binary ---
[tool.hatch.build.targets.wheel]
packages = ["src/pdfmasker"]
# The binary is produced by the custom build hook and lives under a VCS-ignored
# directory, so it must be declared as an artifact to be packaged.
artifacts = ["src/pdfmasker/_bin/*"]

# Enables hatch_build.py::CustomBuildHook for the wheel: it compiles the Go
# binary and marks the wheel platform-specific (py3-none-<platform>).
[tool.hatch.build.targets.wheel.hooks.custom]

# --- sdist: ships the Go sources so a wheel can be rebuilt from scratch ---
[tool.hatch.build.targets.sdist]
include = [
  "src/pdfmasker",
  "cmd",
  "internal",
  "go.mod",
  "go.sum",
  "hatch_build.py",
  "README.md",
  "LICENSE",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "CPY",
    "D203",  # conflicting with D211
    "D213",  # conflicting with D212
    "D100",
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D",
    "ANN",
    "PLR2004",
    "S101",
]
